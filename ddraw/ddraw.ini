[ddraw]
; Integer window scale of the game's display mode (windowed mode). 1 = native size, 2 = double, ...
scale=1
; 1 = borderless window covering the monitor with the picture letterboxed (aspect ratio kept)
fullscreen=0
; 0 = no title bar in windowed mode
border=1
; Scaling filter: 0 = nearest (pixel-sharp), 1 = bilinear (smooth), 2 = sharp bilinear (crisp pixels, smooth only at edges)
filter=2
; 1 = show the game's own cursor over the window and never hide it, 0 = leave cursor handling to the game
cursor=0
; 1 = give the game's DirectInput mouse data computed from the real pointer (correct at any window scale); 0 = pass the real device through
synth_mouse=1
; 1 = make the game's DirectInput mouse non-exclusive (keeps the Windows cursor visible and normal)
shared_mouse=1
; GPU presentation (Direct3D 11): 1 = on (falls back to the old GDI path automatically if it cannot start), 0 = off
gpu=1
; Anti-aliasing on the finished frame (FXAA): 1 = on
aa=1
; Smooth the colour banding that 16-bit graphics cause in skies and gradients: 1 = on
deband=1
; Sharpening 0..100 (0 = off); useful with filter=1
sharpen=0
; 1 = wait for the monitor refresh when presenting
vsync=0
; 1 = write every DirectDraw call to ddraw_log.txt (for bug reports)
log=0
; EXPERIMENT (0 = off): use this display mode instead of the one the game asks for. 'from' limits it to one requested size.
force_width=0
force_height=0
force_from_width=0
force_from_height=0
; EXPERIMENT (0 = off): the size used by the game's own Resolution.sam entry 7 (patched tp.exe), or the default size on the original 1999 exe
width=0
height=0
; EXPERIMENT (0 = off): load the UI layout/art from Data\\Init\\<this> (400, 512, 640, 800 or 1024) whatever the screen size is
ui_width=0
